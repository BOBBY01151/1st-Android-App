<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jay VH</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent;
        }

        #vehicleDisplay {
            position: fixed;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            transform-origin: right center;
            will-change: left, top, transform, opacity;
        }

        #vehicleDisplay.show {
            opacity: 1;
        }

        .vehicle-name {
            display: inline-block;
            font-family: 'Rajdhani', sans-serif;
            font-size: 38px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            white-space: nowrap;
            text-align: right;
            color: #1a5570;
            text-shadow:
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000,
                2px 2px 0 #000,
                -3px 0 0 #000,
                3px 0 0 #000,
                0 -3px 0 #000,
                0 3px 0 #000,
                0 4px 6px rgba(0, 0, 0, 0.7);
            transform-origin: right center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: scale(1);
            }
            to {
                opacity: 0;
                transform: scale(0.9);
            }
        }

        #vehicleDisplay.fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        #vehicleDisplay.fade-out {
            animation: fadeOut 0.3s ease-in forwards;
        }
    </style>
</head>
<body>
    <div id="vehicleDisplay">
        <div class="vehicle-name" id="vehicleName"></div>
    </div>

    <script>
        const vehicleDisplay = document.getElementById('vehicleDisplay');
        const vehicleName = document.getElementById('vehicleName');

        function renderVehicleName(name) {
            if (!name) {
                hideVehicleName();
                return;
            }

            const cleanName = name.replace(/[0-9]/g, '').replace(/\s+/g, ' ').trim();

            vehicleName.textContent = cleanName;

            vehicleDisplay.classList.remove('fade-out');
            vehicleDisplay.classList.add('show', 'fade-in');
        }

        function hideVehicleName() {
            vehicleDisplay.classList.remove('show', 'fade-in');
            vehicleDisplay.classList.add('fade-out');
        }

        // x/y are normalized (0..1)
        function updatePosition(x, y, scale) {
            vehicleDisplay.style.left = `${x * 100}%`;
            vehicleDisplay.style.top = `${y * 100}%`;

            // Anchor the RIGHT edge of the text to the projected point
            // (so the label sits on the left side of the vehicle)
            vehicleDisplay.style.transform = `translate(-100%, -50%) scale(${scale || 1})`;
        }
    </script>
</body>
</html>
