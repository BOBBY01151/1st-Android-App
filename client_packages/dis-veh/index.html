<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Display</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent;
        }
        
        #vehicleDisplay {
            position: fixed;
            opacity: 0;
            pointer-events: none;
            transform-origin: center center;
            /* Smooth transitions for opacity only, not position */
            transition: opacity 0.25s ease;
            /* GPU acceleration for smoother rendering */
            will-change: transform, left, top;
        }
        
        #vehicleDisplay.show {
            opacity: 1;
        }
        
        .vehicle-name {
            display: inline-block;
            font-family: 'Rajdhani', sans-serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
            color: #2a7a9c;
            text-shadow: 
                /* Strong black outline for readability */
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000,
                2px 2px 0 #000,
                -2px 0 0 #000,
                2px 0 0 #000,
                0 -2px 0 #000,
                0 2px 0 #000,
                /* Subtle glow */
                0 0 10px rgba(42, 122, 156, 0.4),
                /* Drop shadow for depth */
                0 3px 5px rgba(0, 0, 0, 0.6);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            /* Prevent any text selection */
            user-select: none;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.85);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        
        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }
        
        #vehicleDisplay.fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        
        #vehicleDisplay.fade-out {
            animation: fadeOut 0.25s ease-in forwards;
        }
    </style>
</head>
<body>
    <div id="vehicleDisplay">
        <div class="vehicle-name" id="vehicleName"></div>
    </div>
    
    <script>
        const vehicleDisplay = document.getElementById('vehicleDisplay');
        const vehicleName = document.getElementById('vehicleName');
        
        function renderVehicleName(name) {
            if (!name) {
                hideVehicleName();
                return;
            }
            
            // Clean up the name (remove numbers, extra spaces)
            const cleanName = name.replace(/[0-9]/g, '').replace(/\s+/g, ' ').trim();
            
            vehicleName.textContent = cleanName;
            
            vehicleDisplay.classList.remove('fade-out');
            vehicleDisplay.classList.add('show', 'fade-in');
        }
        
        function hideVehicleName() {
            vehicleDisplay.classList.remove('show', 'fade-in');
            vehicleDisplay.classList.add('fade-out');
        }
        
        function updatePosition(x, y, scale) {
            // Direct position update - no CSS transitions on position for responsiveness
            vehicleDisplay.style.left = `${x * 100}%`;
            vehicleDisplay.style.top = `${y * 100}%`;
            vehicleDisplay.style.transform = `translate(-50%, -50%) scale(${scale || 1})`;
        }
    </script>
</body>
</html>
