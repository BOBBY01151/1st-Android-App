<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jay VH</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent;
        }
        
        #vehicleDisplay {
            position: fixed;
            /* FIXED POSITION - LEFT SIDE OF SCREEN */
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        
        #vehicleDisplay.show {
            opacity: 1;
        }
        
        .vehicle-name {
            display: inline-block;
            font-family: 'Rajdhani', sans-serif;
            font-size: 38px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            white-space: nowrap;
            color: #1a5570;
            text-shadow: 
                /* Strong black outline */
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000,
                2px 2px 0 #000,
                -3px 0 0 #000,
                3px 0 0 #000,
                0 -3px 0 #000,
                0 3px 0 #000,
                /* Drop shadow for depth */
                0 4px 6px rgba(0, 0, 0, 0.7);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-50%) translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(-50%) translateX(0);
            }
        }
        
        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateY(-50%) translateX(0);
            }
            to {
                opacity: 0;
                transform: translateY(-50%) translateX(-20px);
            }
        }
        
        #vehicleDisplay.fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        
        #vehicleDisplay.fade-out {
            animation: fadeOut 0.3s ease-in forwards;
        }
    </style>
</head>
<body>
    <div id="vehicleDisplay">
        <div class="vehicle-name" id="vehicleName"></div>
    </div>
    
    <script>
        const vehicleDisplay = document.getElementById('vehicleDisplay');
        const vehicleName = document.getElementById('vehicleName');
        
        function renderVehicleName(name) {
            if (!name) {
                hideVehicleName();
                return;
            }
            
            const cleanName = name.replace(/[0-9]/g, '').replace(/\s+/g, ' ').trim();
            
            vehicleName.textContent = cleanName;
            
            vehicleDisplay.classList.remove('fade-out');
            vehicleDisplay.classList.add('show', 'fade-in');
        }
        
        function hideVehicleName() {
            vehicleDisplay.classList.remove('show', 'fade-in');
            vehicleDisplay.classList.add('fade-out');
        }
        
        // Keep this function for compatibility but position is now fixed in CSS
        function updatePosition(x, y, scale) {
            // Position is fixed - no need to update
        }
    </script>
</body>
</html>
